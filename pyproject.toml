[project]
name = "iqssl"
version = "0.1.0"
description = "A controlled benchmark for self-supervised representation learning on IQ signal buffers"
readme = "iqssl/README.md"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
    "scipy>=1.13",
    "pandas>=2.2",
    "pyarrow>=16.0",
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    "tensorboard>=2.17",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "hypothesis>=6.100",
    "ruff>=0.6",
    "mypy>=1.11",
]
wandb = ["wandb>=0.17"]
sweep = [
    "hydra-optuna-sweeper>=1.2",
    "hydra-submitit-launcher>=1.2",
    # Pinned below 2 so Optuna can persist its study, which is what makes a
    # sweep resumable. optuna 2.10.1 predates SQLAlchemy 2.x and cannot stamp
    # its schema-version table against it -- every trial then aborts before
    # starting with a bare AssertionError. optuna itself cannot move, because
    # hydra-optuna-sweeper pins `optuna>=2.10.0,<3.0.0`, so this is the only end
    # of the conflict that can. alembic accepts >=1.4.23 and optuna >=1.1.0, and
    # no code in this project imports sqlalchemy at all -- it arrives purely as
    # optuna's transitive dependency.
    #
    # Without the pin a suspended sweep loses every completed trial: the study
    # lives in memory, and check_sweep_budget requires all nine trials, so a
    # partial study cannot legitimately name a winner. That cost 5 trials of
    # `barlow` once already.
    "sqlalchemy>=1.4,<2",
]

[project.scripts]
iqssl-build-dataset = "iqssl.cli.build_dataset:main"
iqssl-difficulty-report = "iqssl.cli.difficulty_report:main"
iqssl-pretrain = "iqssl.cli.pretrain:main"
iqssl-evaluate = "iqssl.cli.evaluate:main"
iqssl-sweep = "iqssl.cli.sweep:main"
iqssl-aggregate = "iqssl.cli.aggregate:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["iqssl"]

# Torch is intentionally NOT pinned to an index here, so the project installs
# from PyPI anywhere. CPU-only environments (CI, laptops) should opt into the
# smaller wheels explicitly -- see .github/workflows/ci.yml:
#   uv pip install torch --index-url https://download.pytorch.org/whl/cpu
# and GPU hosts pick their CUDA build the same way (.../whl/cu124).

[tool.ruff]
line-length = 100
target-version = "py311"
# CS499/ is an archive of submitted coursework. It is a historical record, not
# code under development, so it is never linted or reformatted.
extend-exclude = ["CS499"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "NPY", "RUF"]
ignore = [
    "E741",    # ambiguous names: `l` is the standard index for a channel tap
    "RUF002",  # docstrings legitimately contain unicode maths (β, τ, φ)
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true
plugins = []

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "slow: long-running tests (tiny-overfit matrix); run explicitly with -m slow",
]
addopts = "-m 'not slow'"
filterwarnings = ["ignore::DeprecationWarning"]
