name: CI

on:
  push:
    branches: ["master", "claude/**"]
  pull_request:
  schedule:
    # Nightly: run the slow tiny-overfit matrix that PRs skip.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels only: CI has no GPU and the CUDA builds cost ~2 GB per install.
  UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  UV_INDEX_STRATEGY: unsafe-best-match

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy iqssl

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Core suite
        run: uv run pytest -m "not slow" -q --cov=iqssl --durations=20

  smoke:
    # Exercises the paths unit tests cannot: config composition, dataset
    # generation to disk, a real training loop, and the eval protocol.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Build a tiny dataset
        run: uv run iqssl-build-dataset generator=smoke out=data/smoke
      - name: Difficulty gate report
        run: uv run iqssl-difficulty-report data=smoke
      - name: Pretrain one method per family
        run: |
          for m in simclr mae ijepa; do
            uv run iqssl-pretrain experiment=smoke_cpu method=$m
          done
      - name: Aggregate
        run: uv run iqssl-aggregate root=outputs/smoke_cpu

  slow:
    # The tiny-overfit matrix over every method. Too slow for every PR, but a
    # silent collapse regression must not survive a night.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[slow-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -m slow -q --durations=0
