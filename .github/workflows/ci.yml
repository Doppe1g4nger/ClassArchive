name: CI

on:
  push:
    branches: ["master", "claude/**"]
  pull_request:
  schedule:
    # Nightly: run the slow tiny-overfit matrix that PRs skip.
    - cron: "0 6 * * *"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # CPU wheels only: CI has no GPU and the CUDA builds cost ~2 GB per install.
  UV_EXTRA_INDEX_URL: https://download.pytorch.org/whl/cpu
  UV_INDEX_STRATEGY: unsafe-best-match

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy iqssl

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - name: Core suite
        run: uv run pytest -m "not slow" -q --cov=iqssl --durations=20

  smoke:
    # Exercises the paths unit tests cannot, by *running the commands*: dataset
    # generation to disk, the difficulty gate, every method's training loop, the
    # tuning sweep, the eval protocol and the aggregator.
    #
    # The distinction is not pedantic. Stage 8 shipped with 33 passing tests and
    # had four separate blockers between it and its first trial -- a search-space
    # value Hydra parsed as a sweep, a struct-mode override that needed to be an
    # append, an uninstalled plugin, and a sweeper config missing two required
    # arguments. Every test passed because each asserted on what `build_command`
    # *returned*, and none on what happened when the command ran. A `--dry-run`
    # could not catch them either: it printed a correct-looking command through
    # all four. So the steps below shell out for real.
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      # `.[sweep]` and not just `.[dev]`: hydra-optuna-sweeper is what
      # iqssl-sweep is built on, it was declared in pyproject and installed
      # nowhere, and that is why the sweep had never once run.
      - run: uv pip install -e ".[dev,sweep]"
      - name: Build a tiny dataset
        run: uv run iqssl-build-dataset --out data/smoke --difficulty smoke --n-samples 4096
      - name: Difficulty gate report
        # --no-gate: the smoke preset is 8 emitters in 256-sample buffers with a
        # 20-epoch oracle, which is far too small to sit in the calibration
        # bands. The step exists to prove the gate *runs*; `easy` is where the
        # bands are actually checked.
        run: uv run iqssl-difficulty-report --data data/smoke --n-train 2000 --n-test 800 --epochs 20 --no-gate
      - name: Pretrain every registered method
        # Twenty steps each. Not a convergence check -- it exercises the paths
        # unit tests cannot: config composition, the dataloader, view building,
        # masking, checkpoint writing, and the fairness-contract validation.
        run: |
          for m in simclr supcon barlow vicreg byol simsiam \
                   mae ijepa tsjepa data2vec supervised random; do
            uv run iqssl-pretrain experiment=smoke_cpu method=$m
          done
      - name: Evaluate through the protocol
        # Frozen probe, kNN and finetune at three label fractions on both label
        # axes, plus the nuisance ridge. Never ran in CI before, so a change that
        # broke the eval path would have surfaced only when someone evaluated a
        # real run by hand.
        #
        # Three methods rather than one, so the aggregator below has a floor, a
        # ceiling and a real method to pool -- which is what exercises the
        # fairness-invariant check. One row would validate nothing.
        run: |
          for m in simclr supervised random; do
            uv run iqssl-evaluate --run "$(ls -dt outputs/smoke_cpu/$m/seed0/*/ | head -1)"
          done
      - name: Tune one method end to end
        # Nine trials at five steps each. The short schedule is legitimate here
        # *because this is a plumbing test and not a fairness claim* -- the
        # budget guard still enforces nine trials, and no number from this run
        # is reported anywhere. What it checks is that the sweeper instantiates,
        # that the search space survives Hydra's override parser, and that
        # Optuna's sampled values actually reach the training loop.
        run: |
          uv run iqssl-sweep --method supervised --experiment hpo \
            --data data/smoke train.max_steps=5
      - name: Aggregate
        # Stage 9. Pools the evaluated runs, enforces the fairness invariants,
        # and writes tables and figures. argparse, not Hydra -- the eval protocol
        # is deliberately not configurable per run. Figures are left on:
        # matplotlib is a hard dependency, so a broken plotting path is a real
        # break, and it is the only place the figure code runs at all.
        run: uv run iqssl-aggregate --root outputs/smoke_cpu --out results/smoke

  slow:
    # The tiny-overfit matrix over every method. Too slow for every PR, but a
    # silent collapse regression must not survive a night. `TestTinyOverfit` in
    # tests/test_train.py carries the marker.
    if: github.event_name == 'schedule' || contains(github.event.head_commit.message, '[slow-ci]')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv venv --python 3.11
      - run: uv pip install -e ".[dev]"
      - run: uv run pytest -m slow -q --durations=0
