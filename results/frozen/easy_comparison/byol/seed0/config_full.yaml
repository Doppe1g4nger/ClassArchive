experiment: easy_comparison
output_root: outputs
train:
  epochs: 20
  batch_size: 128
  base_lr: 0.05764250715881184
  weight_decay: 1.9404819843699845e-07
  optimizer: lars
  warmup_frac: 0.1
  grad_clip: 1.0
  seed: 0
  num_workers: 3
  device: cpu
  augment: standard
  log_every: 400
  probe_every: 0
  max_steps: 5600
encoder:
  name: vit1d
  args:
    size: tiny
    patch_size: 16
    stem: conv
method:
  name: byol
  args:
    proj_hidden: 4096
    proj_dim: 256
    pred_hidden: 4096
    momentum_start: 0.99011744050558
    momentum_end: 1.0
    pool: cls
  train:
    optimizer: lars
    base_lr: 0.2
    weight_decay: 1.5e-06
  search:
    train.base_lr: tag(log, interval(0.05, 1.0))
    train.weight_decay: tag(log, interval(1e-7, 1e-4))
    method.args.momentum_start: interval(0.99, 0.999)
data:
  root: data/easy
  split_variant: iid
  primary_label: emitter
  crop_len: null
