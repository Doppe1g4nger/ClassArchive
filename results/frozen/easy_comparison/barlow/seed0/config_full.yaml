experiment: easy_comparison
output_root: outputs
train:
  epochs: 20
  batch_size: 128
  base_lr: 0.18547444999820137
  weight_decay: 4.7349893044994796e-05
  optimizer: lars
  warmup_frac: 0.1
  grad_clip: 1.0
  seed: 0
  num_workers: 3
  device: cpu
  augment: standard
  log_every: 400
  probe_every: 0
  max_steps: 5600
encoder:
  name: vit1d
  args:
    size: tiny
    patch_size: 16
    stem: conv
method:
  name: barlow
  args:
    lambd: 0.03989301725992405
    proj_hidden: 8192
    proj_dim: 8192
    pool: mean
  train:
    optimizer: lars
    base_lr: 0.2
    weight_decay: 1.5e-06
  search:
    train.base_lr: tag(log, interval(0.05, 1.0))
    train.weight_decay: tag(log, interval(1e-7, 1e-4))
    method.args.lambd: tag(log, interval(1e-4, 5e-2))
data:
  root: data/easy
  split_variant: iid
  primary_label: emitter
  crop_len: null
