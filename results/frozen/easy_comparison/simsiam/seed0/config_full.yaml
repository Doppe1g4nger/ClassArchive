experiment: easy_comparison
output_root: outputs
train:
  epochs: 20
  batch_size: 128
  base_lr: 0.012771120342654234
  weight_decay: 1.0229780864183543e-05
  optimizer: sgd
  warmup_frac: 0.1
  grad_clip: 1.0
  seed: 0
  num_workers: 3
  device: cpu
  augment: standard
  log_every: 400
  probe_every: 0
  max_steps: 5600
encoder:
  name: vit1d
  args:
    size: tiny
    patch_size: 16
    stem: conv
method:
  name: simsiam
  args:
    proj_hidden: 2048
    proj_dim: 2048
    pred_hidden: 1024
    pool: cls
  train:
    optimizer: sgd
    base_lr: 0.05
    weight_decay: 0.0001
  search:
    train.base_lr: tag(log, interval(0.01, 0.5))
    train.weight_decay: tag(log, interval(1e-5, 1e-3))
    method.args.pred_hidden: choice(256, 512, 1024)
data:
  root: data/easy
  split_variant: iid
  primary_label: emitter
  crop_len: null
