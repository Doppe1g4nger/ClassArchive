experiment: easy_comparison
output_root: outputs
train:
  epochs: 20
  batch_size: 128
  base_lr: 0.05432979418408774
  weight_decay: 1.0577814989789257e-07
  optimizer: lars
  warmup_frac: 0.1
  grad_clip: 1.0
  seed: 0
  num_workers: 3
  device: cpu
  augment: standard
  log_every: 400
  probe_every: 0
  max_steps: 5600
encoder:
  name: vit1d
  args:
    size: tiny
    patch_size: 16
    stem: conv
method:
  name: vicreg
  args:
    sim_coeff: 7.136388933477624
    std_coeff: 48.70653383875688
    cov_coeff: 1.0
    proj_hidden: 8192
    proj_dim: 8192
    pool: mean
  train:
    optimizer: lars
    base_lr: 0.2
    weight_decay: 1.0e-06
  search:
    train.base_lr: tag(log, interval(0.05, 1.0))
    train.weight_decay: tag(log, interval(1e-7, 1e-4))
    method.args.sim_coeff: interval(5.0, 50.0)
    method.args.std_coeff: interval(5.0, 50.0)
data:
  root: data/easy
  split_variant: iid
  primary_label: emitter
  crop_len: null
