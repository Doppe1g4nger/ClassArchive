experiment: easy_comparison
output_root: outputs
train:
  epochs: 20
  batch_size: 128
  base_lr: 0.00010619348907224648
  weight_decay: 0.0022397004543485096
  optimizer: adamw
  warmup_frac: 0.1
  grad_clip: 1.0
  seed: 0
  num_workers: 3
  device: cpu
  augment: standard
  log_every: 400
  probe_every: 0
  max_steps: 5600
encoder:
  name: vit1d
  args:
    size: tiny
    patch_size: 16
    stem: conv
method:
  name: data2vec
  args:
    mask_ratio: 0.47931003711426445
    top_k_layers: 4
    beta: 1.0
  train:
    optimizer: adamw
    base_lr: 0.001
    weight_decay: 0.01
  search:
    train.base_lr: tag(log, interval(1e-4, 1e-2))
    train.weight_decay: tag(log, interval(1e-3, 0.3))
    method.args.mask_ratio: interval(0.3, 0.7)
    method.args.top_k_layers: choice(2, 4, 6)
data:
  root: data/easy
  split_variant: iid
  primary_label: emitter
  crop_len: null
