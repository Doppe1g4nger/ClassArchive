syntax = "proto3";

package pulse;

// A single complex IQ sample fed into the detector.
message IQSample {
  double i = 1;
  double q = 2;
  uint64 sample_index = 3;
}

// A batch of IQ samples. Both architectures move samples across their
// module boundary in batches rather than one-at-a-time to amortize
// call/message overhead.
message IQBatch {
  repeated IQSample samples = 1;
  double sample_rate_hz = 2;
}

// Emitted by the detector module for every pulse it finds in a batch.
message PulseEvent {
  uint64 start_sample = 1;
  uint64 end_sample = 2;
  double peak_amplitude = 3;
  double mean_amplitude = 4;
  double duration_seconds = 5;
}

// A run of pulse events the detector hands off in one shot. This is the
// message type that crosses the module boundary in the monolith and the
// wire in the microservice build.
message PulseEventBatch {
  repeated PulseEvent events = 1;
}

// Emitted by the stats module after it has consumed some number of
// PulseEventBatch messages.
message PulseSummary {
  uint64 pulse_count = 1;
  double mean_peak_amplitude = 2;
  double mean_duration_seconds = 3;
  double mean_pri_seconds = 4; // pulse repetition interval
  double min_peak_amplitude = 5;
  double max_peak_amplitude = 6;
}

// Running output of the spectrogram module: a small fixed set of
// magnitude bins, updated as each IQBatch is folded in.
message SpectrogramSummary {
  double bin_hz = 1;              // frequency spacing between bins
  repeated double max_magnitude = 2;
  repeated double mean_magnitude = 3;
  uint64 frame_count = 4;
}

// Running output of the jammer-detection module.
message JamSummary {
  uint64 batches_total = 1;
  uint64 batches_flagged = 2;
  double max_duty_cycle = 3;    // highest fraction of samples over the power threshold seen in one batch
  double max_mean_power = 4;
}

// One candidate emitter track the deinterleaver has grouped pulses into.
message EmitterTrack {
  uint32 track_id = 1;
  uint64 pulse_count = 2;
  double estimated_pri_seconds = 3;
  double mean_peak_amplitude = 4;
}

// Running output of the deinterleaver module: every track seen so far.
message DeinterleaveSummary {
  repeated EmitterTrack tracks = 1;
}

// The envelope that flows through the pipeline as a single linear chain
// -- detector -> stats -> deinterleaver -> spectrogram -> jammer -- rather
// than fanning out from a hub. Each stage reads the fields it needs and
// writes its own field before passing the frame to the next stage, so by
// the end of the chain it carries every stage's running summary. iq is
// populated once per batch and never modified again; events is populated
// by the detector stage; the four summary fields are each owned by
// exactly one stage and are the running (cumulative) total as of this
// batch, same as before.
message PipelineFrame {
  IQBatch iq = 1;
  PulseEventBatch events = 2;
  PulseSummary stats = 3;
  DeinterleaveSummary deinterleave = 4;
  SpectrogramSummary spectrogram = 5;
  JamSummary jam = 6;
}
