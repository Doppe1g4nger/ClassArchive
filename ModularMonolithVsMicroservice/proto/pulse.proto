syntax = "proto3";

package pulse;

// A batch of IQ samples in packed columnar layout -- THE defining
// change of the max-optimization branch. The main branch models a batch
// as `repeated IQSample` (one message per sample, each carrying i, q,
// and its own sample_index); profiling measured that layout as the
// dominant cost everywhere it appears: protobuf stores repeated
// messages as an array of pointers to separately heap-allocated
// objects, so every read pointer-chases (21% L1d miss rate in the C++
// monolith), every parse allocates 10,000 objects, and every sample
// pays tag+length wire overhead plus an explicit index that is always
// just first_sample_index + position.
//
// Packed repeated scalars fix all of it at once: i[] and q[] are
// contiguous double arrays (memcpy-class parse/serialize, direct SIMD
// loads, zero pointer-chasing), and the per-sample index is replaced by
// one first_sample_index (sample k's index = first_sample_index + k --
// exactly how every consumer already used it).
message IQBatch {
  double sample_rate_hz = 1;
  uint64 first_sample_index = 2;
  repeated double i = 3;  // packed by default in proto3
  repeated double q = 4;
}

// Pulse events in the same columnar layout, for the same reasons:
// entry k across the five parallel arrays is one detected pulse. The
// main branch's `repeated PulseEvent` paid one heap object plus message
// framing per event (~1,000/batch at this repo's scale).
message PulseEventBatch {
  // fixed64, not uint64 (theoretical-limits round four): varint
  // coding of these two arrays -- ~2,000 variable-width decodes and
  // size computations per batch -- showed up as ~15% of the chain's
  // pacing service's instructions under callgrind. fixed64 makes them
  // memcpy-class on the wire like the three double arrays below, at
  // the cost of 8 bytes each instead of 3-4 (sample indices at this
  // repo's scale fit in 3 varint bytes): ~9KB more wire per batch,
  // paid to a transport that is a memcpy into shared memory. The
  // in-memory API type is unchanged (uint64).
  repeated fixed64 start_sample = 1;
  repeated fixed64 end_sample = 2;
  repeated double peak_amplitude = 3;
  repeated double mean_amplitude = 4;
  repeated double duration_seconds = 5;
}

// Emitted by the stats module after it has consumed some number of
// PulseEventBatch messages.
message PulseSummary {
  uint64 pulse_count = 1;
  double mean_peak_amplitude = 2;
  double mean_duration_seconds = 3;
  double mean_pri_seconds = 4; // pulse repetition interval
  double min_peak_amplitude = 5;
  double max_peak_amplitude = 6;
}

// Running output of the spectrogram module: a small fixed set of
// magnitude bins, updated as each IQBatch is folded in.
message SpectrogramSummary {
  double bin_hz = 1;              // frequency spacing between bins
  repeated double max_magnitude = 2;
  repeated double mean_magnitude = 3;
  uint64 frame_count = 4;
}

// Running output of the jammer-detection module.
message JamSummary {
  uint64 batches_total = 1;
  uint64 batches_flagged = 2;
  double max_duty_cycle = 3;    // highest fraction of samples over the power threshold seen in one batch
  double max_mean_power = 4;
}

// One candidate emitter track the deinterleaver has grouped pulses into.
message EmitterTrack {
  uint32 track_id = 1;
  uint64 pulse_count = 2;
  double estimated_pri_seconds = 3;
  double mean_peak_amplitude = 4;
}

// Running output of the deinterleaver module: every track seen so far.
message DeinterleaveSummary {
  repeated EmitterTrack tracks = 1;
}

// The envelope that flows through the pipeline as a single linear chain
// -- detector -> stats -> deinterleaver -> spectrogram -> jammer -- rather
// than fanning out from a hub. Each stage reads the fields it needs and
// writes its own field before passing the frame to the next stage, so by
// the end of the chain it carries every stage's running summary. iq is
// populated once per batch and never modified again; events is populated
// by the detector stage; the four summary fields are each owned by
// exactly one stage and are the running (cumulative) total as of this
// batch, same as before.
message PipelineFrame {
  IQBatch iq = 1;
  PulseEventBatch events = 2;
  PulseSummary stats = 3;
  DeinterleaveSummary deinterleave = 4;
  SpectrogramSummary spectrogram = 5;
  JamSummary jam = 6;
}
