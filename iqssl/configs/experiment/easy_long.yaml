# @package _global_
# The viability gate: can the benchmark's own encoder, loop and eval protocol
# reproduce a task the difficulty gate already showed is learnable?
#
# It answers YES, as of the conv-stem encoder. Emitter linear probe at 100%
# labels, 5,600 steps, single seed:
#
#     supervised  0.746   (kNN 0.758)
#     random      0.159   (kNN 0.205)
#     chance      0.0625
#
# A gap of 0.587, 4.7x the floor. With the previous linear-stem encoder the same
# experiment read 0.103 against 0.092 -- a gap of 0.011, inside seed noise --
# and the diagnosis of that failure is written up in iqssl/README.md.
#
# Re-measure BOTH arms whenever the encoder changes. The floor is a property of
# the encoder, not of the dataset: it rose 0.092 -> 0.159 when the stem changed,
# because untrained PatchStem features are better than untrained linear-embed
# ones. Carrying the old floor forward would have overstated the gap by 11%.
# analysis/invariants.py will refuse to pool runs whose encoder dicts differ,
# which catches this, but do not make it do the catching.
#
# The step budget is set from a measurement, and the measurement corrected two
# wrong beliefs worth recording:
#
#   * A first estimate of 0.344 steps/s was taken while an eight-run sweep was
#     competing for the same four cores. Idle, the same config runs at 1.08 --
#     3.1x faster. Never size a budget from a contended timing.
#   * cnn1d was briefly adopted here on the theory that a convolutional encoder
#     avoids attention's quadratic cost, then dropped again on a measurement
#     that said it was slower. Both the 1.9x and the 5.8x figures that comment
#     carried were wrong, and the mistake is the same one twice: 1.9x compared a
#     *contended* ViT timing against an uncontended CNN one, and 5.8x compared
#     vit1d_tiny against cnn1d **r18** -- a far larger model -- and then reported
#     it as a fact about "the CNN". Like for like, cnn1d_tiny runs at 5.72
#     steps/s against vit1d_tiny's 1.81: 3.2x *faster*, not slower. The size
#     name is part of the measurement.
#
# 5,600 steps x 128 = 717k samples, matching the sample budget that took the
# difficulty gate's SmallCNN to 0.891 on this data (12k buffers x 60 epochs).
# Spent over the full 84k train split rather than a 12k subset, since more
# unique data beats more repetitions at equal compute.
#
# ~85 minutes at the conv stem's 1.11 steps/s. That is close to the ~90 minutes
# this comment claimed for the linear stem, but not for the same reason: the
# linear stem runs at 1.81 steps/s, and the earlier "1.08" was measured before
# num_workers=3 was set. Two wrong numbers happening to bracket the right answer
# is not corroboration.
#
# The budget is not obviously sufficient. train_acc reaches 0.720 and is still
# rising when the schedule ends, and the difficulty gate's SmallCNN reached
# 0.891. The gate passes decisively at this budget, so raising it was not needed
# to answer the binary question -- but a headline comparison may want more.
#
# Evaluate with --skip-finetune: the linear probe answers the binary question,
# and six finetunes per run cost hours that buy nothing here.
experiment: easy_long
data:
  root: data/easy
train:
  epochs: 20
  batch_size: 128
  max_steps: 5600
  device: cpu
  log_every: 400
  probe_every: 0
  # Loading and cropping 120k memmapped buffers is a real share of each step,
  # and it was serialised with training at the default num_workers=0.
  num_workers: 3
  # `light` is phase + small timing only, measured to cost the emitter
  # fingerprint nothing (d = 13.4 unaugmented, 13.4 under light). The gate asks
  # whether the encoder *can* learn the task; augmentation strength is a
  # separate question and would confound this one.
  #
  # That claim was tested rather than trusted, since `light` still phase-rotates
  # every sample at p=1.0 while the difficulty gate's 0.891 oracle saw raw
  # buffers. Running the failing configuration at augment=none reproduced the
  # failure exactly, so augmentation was not what blocked the gate.
  augment: light
