# @package _global_
# The shared short schedule every tuning trial runs. Held identical across
# methods -- it is the budget, not a per-method choice.
#
#
# The dataset is blanked rather than inherited. An experiment that names no
# `data:` group composes onto the root default, `smoke` -- 2,861 buffers on
# which the difficulty gate showed every method probing at chance. Nine trials
# would then have maximized a validation probe that was noise, ranked the noise,
# and reported a winner. Tuning belongs on the data the comparison reports, so
# the caller names it: `iqssl-sweep --method simclr --data data/easy`.
#
# `null`, not `???`: OmegaConf's merge *ignores* MISSING in the merge source, so
# `root: ???` here leaves `data/smoke` standing and reads as a guard while being
# a no-op. Only an explicit value overrides.
experiment: hpo
val_probe: true   # main() must return a probe score for the sweeper to maximize
data:
  root: null
train:
  epochs: 3
  batch_size: 128
  max_steps: 400
  device: cpu
  log_every: 100
  probe_every: 0
  augment: standard
