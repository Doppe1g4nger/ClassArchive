name: simsiam
args:
  proj_hidden: 2048
  proj_dim: 2048
  pred_hidden: 512
  pool: cls
# SGD, per the paper. The predictor is held out of cosine decay via fix_lr --
# one of the few genuinely load-bearing details in SimSiam: decaying it
# measurably collapses the representation.
train:
  optimizer: sgd
  base_lr: 0.05
  weight_decay: 1.0e-4

# Tuning space for the equal-budget sweep. Keys must be METHOD_TUNABLE
# (base_lr, weight_decay) or this method's own constructor arguments;
# check_search_space refuses anything else. Optimizer *family* is absent
# deliberately -- it is a published default, not a tuned knob.
search:
  train.base_lr: "tag(log, interval(0.01, 0.5))"
  train.weight_decay: "tag(log, interval(1e-5, 1e-3))"
  method.args.pred_hidden: "choice(256, 512, 1024)"
