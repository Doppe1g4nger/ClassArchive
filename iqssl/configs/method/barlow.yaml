name: barlow
args:
  lambd: 5.0e-3
  proj_hidden: 8192
  proj_dim: 8192
  pool: mean
# The wide projector is not a fairness violation to be equalized away: Barlow
# Twins genuinely needs one, and capping it at SimCLR's 128 would be a handicap
# dressed up as fairness. The encoder is the control variable, not the heads.
train:
  optimizer: lars
  base_lr: 0.2
  weight_decay: 1.5e-6

# Tuning space for the equal-budget sweep. Keys must be METHOD_TUNABLE
# (base_lr, weight_decay) or this method's own constructor arguments;
# check_search_space refuses anything else. Optimizer *family* is absent
# deliberately -- it is a published default, not a tuned knob.
search:
  train.base_lr: "tag(log, interval(0.05, 1.0))"
  train.weight_decay: "tag(log, interval(1e-7, 1e-4))"
  method.args.lambd: "tag(log, interval(1e-4, 5e-2))"
