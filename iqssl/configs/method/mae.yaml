name: mae
args:
  mask_ratio: 0.75
  decoder_dim: 192
  decoder_depth: 4
  # normalize_targets stays off by default: per-patch standardization erases
  # the amplitude envelope, and for OOK the envelope IS the modulation.
  normalize_targets: false
# AdamW per the paper; masked methods were not published with LARS.
train:
  optimizer: adamw
  base_lr: 1.5e-3
  weight_decay: 0.05

# Tuning space for the equal-budget sweep. Keys must be METHOD_TUNABLE
# (base_lr, weight_decay) or this method's own constructor arguments;
# check_search_space refuses anything else. Optimizer *family* is absent
# deliberately -- it is a published default, not a tuned knob.
search:
  train.base_lr: "tag(log, interval(1e-4, 1e-2))"
  train.weight_decay: "tag(log, interval(1e-3, 0.3))"
  method.args.mask_ratio: "interval(0.5, 0.85)"
